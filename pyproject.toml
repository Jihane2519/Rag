[project]
name = "rag-against-the-machine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain-text-splitters",
    "pydantic",
    "rank-bm25",
    "tqdm",
    "fire",
    "transformers",
    "torch",
    "numpy",
    "sentence-transformers",  # pour le bonus embeddings
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "types-tqdm",
]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["rank_bm25", "fire"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages =["src"]
