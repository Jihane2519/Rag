[project]
name = "rag-against-the-machine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "rank-bm25",
    "tqdm",
    "fire",
    "transformers",
    "torch",
    "sentence-transformers",  # pour le bonus embeddings
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages =["src"]
